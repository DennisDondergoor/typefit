[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "typefit"
version = "0.1.0"
description = "A terminal-based touch typing practice app"
readme = "README.md"
requires-python = ">=3.8"
dependencies = []

[project.scripts]
typefit = "typefit.main:main"

[tool.setuptools.packages.find]
where = ["."]
